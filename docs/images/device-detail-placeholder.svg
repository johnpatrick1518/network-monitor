<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Device detail screenshot placeholder</title>
  <desc id="description">Not an application screenshot. Replace with a synthetic device history capture.</desc>
  <rect width="1200" height="640" rx="16" fill="#0b1019"/>
  <rect x="160" y="40" width="880" height="560" rx="12" fill="#111923" stroke="#23303e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="600" y="250" text-anchor="middle" fill="#5de0b4" font-family="system-ui, sans-serif" font-size="18" letter-spacing="3">SCREENSHOT PLACEHOLDER</text>
  <text x="600" y="315" text-anchor="middle" fill="#ecf2f7" font-family="system-ui, sans-serif" font-size="36">Device health and history</text>
  <text x="600" y="370" text-anchor="middle" fill="#8798aa" font-family="system-ui, sans-serif" font-size="20">Capture latency and uptime using synthetic data.</text>
  <text x="600" y="410" text-anchor="middle" fill="#8798aa" font-family="system-ui, sans-serif" font-size="16">Keep the DEMO MODE context visible.</text>
</svg>
